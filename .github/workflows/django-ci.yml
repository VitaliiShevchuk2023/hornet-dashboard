name: Django CI

on:
  push:
    branches: [main]
    paths: ["django/**"]
  pull_request:
    paths: ["django/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: django

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: hornet_test
          POSTGRES_USER: hornet
          POSTGRES_PASSWORD: hornet
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-test-key-not-for-production
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: hornet_test
      POSTGRES_USER: hornet
      POSTGRES_PASSWORD: hornet
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: django/requirements.txt

      - name: Install system dependencies (GDAL/GEOS/PROJ for GeoDjango)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdal-bin libgdal-dev libgeos-dev libproj-dev

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Validate migrations apply cleanly
        run: python manage.py migrate --noinput

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test

      - name: Validate Dockerfile builds
        run: docker build -t hornet-django-ci .
